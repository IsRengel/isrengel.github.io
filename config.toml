      # Summary section
      [languages.es.params.summary]
          enable = true
          icon = "fa-user"
          title = "Sobre Mí"
          summary = "Soy un Ingeniero DevOps con sólida experiencia en infraestructura en la nube, automatización, desarrollo backend y plataformas orientadas a datos. Me especializo en construir sistemas seguros, escalables y rentables, con un fuerte enfoque en DevSecOps, DataOps y arquitecturas de procesamiento de datos basadas en la nube.\n\nTengo experiencia práctica diseñando y operando infraestructura en la nube principalmente en AWS, con exposición adicional a entornos de Azure. Como parte de mi rol de DevOps, he diseñado y soportado infraestructuras para procesar volúmenes pequeños y grandes de datos, permitiendo tuberías de datos confiables y flujos de trabajo de análisis. Mi experiencia en desarrollo backend me permite colaborar eficazmente con los equipos de ingeniería y alinear la infraestructura con las necesidades de aplicaciones y datos.\n\nMe impulsa el aprendizaje y la mejora continua, siempre buscando nuevos desafíos técnicos que me empujen a crecer profesionalmente. Disfruto trabajando en entornos colaborativos, proponiendo soluciones y desempeñándome eficazmente bajo presión.\n\n\"Cuanto más aprendo, más me doy cuenta de cuánto hay por aprender.\" — atribuido a Albert Einstein"
          keywordsAsTags = true

      # Experiences section
      [languages.es.params.experiences]
          enable = true
          icon = "fa-briefcase"
          title = "Experiencia"
          [[languages.es.params.jobs.list]]
          position = "Ingeniero DevOps"
          dates = "Mar 2024 - Presente"
          company = "Plika"
          details = "Diseño, implementación y mantenimiento de infraestructura en la nube principalmente en AWS, con soporte adicional para integraciones basadas en Azure.\n\nGestión y operación de clústeres de Kubernetes para cargas de trabajo de producción e intensivas en datos.\n\nImplementación de pipelines de CI/CD con un fuerte enfoque en la automatización, la confiabilidad y la escalabilidad.\n\nOptimización de costos de infraestructura analizando patrones de uso, mejorando la asignación de recursos y reduciendo el gasto innecesario en la nube.\n\nPrácticas de DevSecOps: endurecimiento de la infraestructura, gestión de secretos y control de acceso seguro.\n\nDiseño y propuesta de infraestructuras de datos seguras y basadas en eventos, incluidas arquitecturas de Data Lakes, Lakehouse y Data Warehouse.\n\nImplementación de Infraestructura como Código (IaC) y estrategias de monitoreo para garantizar la observabilidad, el control de costos y la confiabilidad del sistema."
          [[languages.es.params.jobs.list]]
          position = "Desarrollador Backend"
          dates = "Ago 2023 - Oct 2024"
          company = "Plika"
          details = "Desarrollo backend utilizando Python, con una fuerte especialización en FastAPI para APIs de alto rendimiento y escalables.\n\nDesarrollo y mantenimiento de servicios backend utilizando Django para aplicaciones críticas para el negocio.\n\nDiseño e implementación de APIs RESTful, siguiendo una arquitectura limpia y mejores prácticas.\n\nModelado de bases de datos, optimización de consultas y ajuste de rendimiento.\n\nIntegración de servicios backend con infraestructura en la nube, sistemas de autenticación y servicios de terceros."
          [[languages.es.params.jobs.list]]
          position = "Ingeniero de Datos"
          dates = "Jun 2023 - Ago 2023"
          company = "Plika"
          details = "Diseño e implementación de pipelines de datos.\n\nFlujos de trabajo de procesamiento y transformación de datos.\n\nColaboración con equipos de backend para integración de datos."
          [[languages.es.params.jobs.list]]
          position = "Consultor DevOps (Freelance)"
          dates = "Jul 2022 - Presente"
          company = "Latix"
          details = "Prestación de servicios de consultoría DevOps y en la nube por horas para múltiples empresas.\n\nDiseño e implementación de infraestructura en la nube en AWS, adaptada a los requisitos específicos del cliente.\n\nConfiguración, optimización y soporte operativo de clústeres Kubernetes.\n\nImplementación de pipelines de CI/CD, automatización e Infraestructura como Código.\n\nOptimización de costos de infraestructura a través del ajuste de tamaño, consolidación de recursos y análisis de uso.\n\nDiseño de infraestructura centrado en la seguridad siguiendo las mejores prácticas de DevSecOps."

