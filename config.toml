  # Summary section
  [languages.en.params.summary]
  enable = true
  icon = "fa-user"
  title = "About Me"
  summary = """
DevOps Engineer specializing in cloud infrastructure, platform engineering, and automation. I design and operate secure, scalable, and cost-efficient systems primarily on AWS, with experience in Kubernetes, Infrastructure as Code, and CI/CD automation.

My work focuses on building reliable platforms that support backend services and data-intensive workloads. I have hands-on experience implementing Kubernetes-based environments, infrastructure provisioning with Terraform, automated deployment pipelines, and observability systems using metrics, logs, and APM tools.

I have also worked on large-scale data platforms based on Data Lake and Data Warehouse architectures for processing high-volume datasets, implementing layered data models such as Bronze, Silver, and Gold to structure ingestion, transformation, and analytics workflows.

Additionally, I have participated in the deployment of AI-related platforms on AWS, including services based on Amazon Bedrock and MCP servers used for running and integrating AI models within production systems.

I also work extensively with DevSecOps practices, including secure networking, VPN access, TLS management, secrets handling, and infrastructure hardening.

My background in backend development allows me to bridge the gap between infrastructure and application development, enabling teams to deliver software faster and more reliably.

I am passionate about solving complex infrastructure problems, continuously improving systems, and learning new technologies.
"""
  keywordsAsTags = true

