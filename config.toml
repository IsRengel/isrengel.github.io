  # Summary section
  [languages.es.params.summary]
  enable = true
  icon = "fa-user"
  title = "Sobre Mí"
  summary = """
Ingeniero DevOps especializado en infraestructura en la nube, platform engineering y automatización. Diseño y opero sistemas seguros, escalables y eficientes en costos principalmente sobre AWS, con experiencia en Kubernetes, Infraestructura como Código y automatización de CI/CD.

Mi trabajo se enfoca en construir plataformas confiables que soporten servicios backend y cargas de trabajo intensivas en datos. Tengo experiencia práctica implementando entornos basados en Kubernetes, aprovisionamiento de infraestructura con Terraform, pipelines de despliegue automatizados y sistemas de observabilidad basados en métricas, logs y herramientas APM.

También he trabajado en plataformas de datos basadas en arquitecturas Data Lake y Data Warehouse para procesamiento de grandes volúmenes de información, utilizando modelos de datos por capas como Bronze, Silver y Gold para organizar pipelines de ingestión, transformación y análisis de datos.

Adicionalmente, he participado en la implementación de plataformas relacionadas con inteligencia artificial en AWS, incluyendo el despliegue de servicios basados en Amazon Bedrock y servidores MCP para la ejecución e integración de modelos de IA dentro de plataformas productivas.

También trabajo ampliamente con prácticas de DevSecOps, incluyendo redes seguras, acceso mediante VPN, gestión de TLS, manejo de secretos y endurecimiento de infraestructura.

Mi experiencia en desarrollo backend me permite conectar de forma efectiva la infraestructura con las aplicaciones, facilitando que los equipos de ingeniería entreguen software de forma más rápida y confiable.

Me motiva resolver problemas complejos de infraestructura, mejorar continuamente los sistemas y aprender nuevas tecnologías.
"""
