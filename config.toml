      # Summary section
      [languages.en.params.summary]
          enable = true
          icon = "fa-user"
          title = "About Me"
          summary = "I am a DevOps Engineer with strong experience in cloud infrastructure, automation, backend development, and data-oriented platforms. I specialize in building secure, scalable, and cost-efficient systems, with a strong focus on DevSecOps, DataOps, and cloud-based data processing architectures.\n\nI have hands-on experience designing and operating cloud infrastructure primarily on AWS, with additional exposure to Azure environments. As part of my DevOps role, I have designed and supported infrastructures for processing both small and large volumes of data, enabling reliable data pipelines and analytics workflows. My background in backend development allows me to collaborate effectively with engineering teams and align infrastructure with application and data needs.\n\nI am highly driven by learning and continuous improvement, always seeking new technical challenges that push me to grow professionally. I enjoy working in collaborative environments, proposing solutions, and performing effectively under pressure.\n\n\"The more I learn, the more I realize how much there is to learn.\" — attributed to Albert Einstein"
          keywordsAsTags = true

      # Experiences section
      [languages.en.params.experiences]
          enable = true
          icon = "fa-briefcase"
          title = "Experiences"
          [[languages.en.params.jobs.list]]
          position = "DevOps Engineer"
          dates = "Mar 2024 - Present"
          company = "Plika"
          details = "Design, implementation, and maintenance of cloud infrastructure primarily on AWS, with additional support for Azure-based integrations.\n\nManagement and operation of Kubernetes clusters for production and data-intensive workloads.\n\nImplementation of CI/CD pipelines with a strong focus on automation, reliability, and scalability.\n\nInfrastructure cost optimization by analyzing usage patterns, improving resource allocation, and reducing unnecessary cloud spend.\n\nDevSecOps practices: infrastructure hardening, secrets management, and secure access control.\n\nDesign and proposal of secure, event-driven data infrastructures including Data Lakes, Lakehouse, and Data Warehouse architectures.\n\nImplementation of Infrastructure as Code (IaC) and monitoring strategies to ensure observability, cost control, and system reliability."
          [[languages.en.params.jobs.list]]
          position = "Backend Developer"
          dates = "Aug 2023 - Oct 2024"
          company = "Plika"
          details = "Backend development using Python, with a strong specialization in FastAPI for high-performance and scalable APIs.\n\nDevelopment and maintenance of backend services using Django for business-critical applications.\n\nDesign and implementation of RESTful APIs, following clean architecture and best practices.\n\nDatabase modeling, query optimization, and performance tuning.\n\nIntegration of backend services with cloud infrastructure, authentication systems, and third-party services."
          [[languages.en.params.jobs.list]]
          position = "Data Engineer"
          dates = "Jun 2023 - Aug 2023"
          company = "Plika"
          details = "Data pipeline design and implementation.\n\nData processing and transformation workflows.\n\nCollaboration with backend teams for data integration."
          [[languages.en.params.jobs.list]]
          position = "DevOps Consultant (Freelance)"
          dates = "Jul 2022 - Present"
          company = "Latix"
          details = "Provision of DevOps and cloud consulting services on an hourly basis for multiple companies.\n\nDesign and implementation of cloud infrastructure on AWS, tailored to client-specific requirements.\n\nKubernetes cluster setup, optimization, and operational support.\n\nImplementation of CI/CD pipelines, automation, and Infrastructure as Code.\n\nInfrastructure cost optimization through right-sizing, resource consolidation, and usage analysis.\n\nSecurity-focused infrastructure design following DevSecOps best practices."

